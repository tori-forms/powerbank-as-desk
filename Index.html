<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>볼타레스 AS Desk</title>
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#18201c; --ink2:#4b5650; --ink3:#86908a; --line:#e3e6e1; --line2:#eef0ec;
  --brand:#1f4b3f; --brand2:#2f6b5a; --brandSoft:#e6efe9;
  --red:#c2412d; --redSoft:#fbe9e5; --amber:#b7791f; --amberSoft:#fdf3e1; --blue:#2c5d9e; --blueSoft:#e7eef8;
  --violet:#6b4fa3; --violetSoft:#efe9f8; --gray:#6b7280; --graySoft:#eef0f2; --green:#2f7a4f; --greenSoft:#e5f3ea;
  --r:10px; --sh:0 1px 2px rgba(20,30,25,.05),0 2px 8px rgba(20,30,25,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
#app{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:#17362e;color:#dfe9e4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:#2f6b5a;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.brand b{display:block;font-size:14px;letter-spacing:.3px;color:#fff} .brand small{color:#9fb8ad;font-size:11px}
.nav{padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#cfdcd5;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:#2a5145;color:#fff;font-weight:600}
.nav .ic{width:18px;text-align:center;opacity:.9}
.nav .cnt{margin-left:auto;background:#e8a33d;color:#1b1b1b;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700;min-width:20px;text-align:center}
.nav .cnt.z{background:rgba(255,255,255,.12);color:#b8cbc2;font-weight:500}
.side .foot{margin-top:auto;padding:12px 14px;font-size:11.5px;color:#9fb8ad;border-top:1px solid rgba(255,255,255,.08)}
.side .foot div{display:flex;justify-content:space-between;gap:6px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:700}
.top .sub{color:var(--ink3);font-size:12.5px}
.top .sp{flex:1}
.top .me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.top .me input{width:92px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fafbf9}
#view{padding:18px 22px 60px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#c9cfc8;background:#fafbf9}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff} .btn.pri:hover{background:var(--brand2)}
.btn.red{color:var(--red);border-color:#efc9c1} .btn.red:hover{background:var(--redSoft)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card h3{margin:0;font-size:14px}
.card .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.card .bd{padding:12px 14px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:hover{border-color:#c6cec8}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:26px;font-weight:750;letter-spacing:-.5px;margin-top:2px}
.kpi .v small{font-size:12px;color:var(--ink3);font-weight:500;margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--ink3)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:18px}
.p-ship{background:var(--amberSoft);color:var(--amber)} .p-retreq{background:var(--redSoft);color:var(--red)}
.p-returning{background:var(--blueSoft);color:var(--blue)} .p-inspect{background:var(--violetSoft);color:var(--violet)}
.p-dispose{background:#fff1d6;color:#8a5a00} .p-done{background:var(--greenSoft);color:var(--green)} .p-closed{background:var(--graySoft);color:var(--gray)}
.p-new{background:var(--amberSoft);color:var(--amber)} .p-gray{background:var(--graySoft);color:var(--gray)}
.p-red{background:var(--redSoft);color:var(--red)} .p-green{background:var(--greenSoft);color:var(--green)} .p-blue{background:var(--blueSoft);color:var(--blue)} .p-violet{background:var(--violetSoft);color:var(--violet)}
.mtag{display:inline-block;white-space:nowrap;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:5px;letter-spacing:.2px;line-height:17px}
.m-P20BOTA25{background:#e8edf5;color:#3a5680} .m-P20VA{background:#f3e6f0;color:#8a3a78} .m-x{background:var(--graySoft);color:var(--gray)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:#f7f8f6;text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#f8faf7}
.tw{overflow-x:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--ink3)} .small{font-size:12px} .nowrap{white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button .n{font-size:11px;opacity:.75}
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tool .sp{flex:1}
.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;min-width:0}
.inp:focus,textarea.inp:focus{outline:2px solid #b8d2c6;border-color:#8fb3a3}
textarea.inp{width:100%;resize:vertical}
.split{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:14px;align-items:start}
.split.home{grid-template-columns:minmax(0,1fr) 360px}
.p-arrived{background:#e0f2f1;color:#1d6b64}
.list{display:flex;flex-direction:column;max-height:calc(100vh - 190px);overflow:auto}
.li{padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.li:hover{background:#f8faf7} .li.on{background:var(--brandSoft);box-shadow:inset 3px 0 0 var(--brand)}
.li .r1{display:flex;gap:8px;align-items:center} .li .r1 b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r2{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;word-break:break-all}
.pre{white-space:pre-wrap;background:#fafbf9;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13px;max-height:260px;overflow:auto}
.flags{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.flag{font-size:12.5px;padding:6px 10px;border-radius:7px;background:var(--amberSoft);color:#7a4f0f}
.flag.r{background:var(--redSoft);color:#8f2c1d}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.r.on{background:var(--red);border-color:var(--red)} .chip.g.on{background:var(--green);border-color:var(--green)} .chip.a.on{background:var(--amber);border-color:var(--amber)}
.snchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin:0 6px 6px 0;background:#fff;font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);min-width:0}
.fld > span{font-weight:600}
.sec{border-top:1px solid var(--line2);padding:14px 0 4px}
.sec h4{margin:0 0 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.drawer-bg{position:fixed;inset:0;background:rgba(18,28,24,.28);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:21;box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .db{padding:4px 20px 30px;overflow:auto;flex:1}
.steps{display:flex;gap:0;margin:12px 0 4px}
.step{flex:1;text-align:center;font-size:11.5px;color:var(--ink3);position:relative;padding-top:18px}
.step:before{content:"";position:absolute;top:6px;left:0;right:0;height:3px;background:var(--line)}
.step:first-child:before{left:50%} .step:last-child:before{right:50%}
.step i{position:absolute;top:1px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--line);z-index:1}
.step.ok{color:var(--ink2)} .step.ok:before{background:var(--brand2)} .step.ok i{border-color:var(--brand2);background:var(--brand2)}
.step.cur{color:var(--ink);font-weight:700} .step.cur i{border-color:var(--amber);background:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(18,28,24,.35);z-index:30;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:12px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mb{padding:16px 18px} .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#1b2a24;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.err{background:#8f2c1d}
.loading{padding:60px;text-align:center;color:var(--ink3)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:13px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-r{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}
.bar-r .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.bar-r .tr{height:14px;background:var(--line2);border-radius:4px;overflow:hidden;display:flex}
.bar-r .tr span{display:block;height:100%}
.bar-r .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cols .stk{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.cols .lab{font-size:11px;color:var(--ink3)} .cols .num{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.note{font-size:12.5px;color:var(--ink2);background:#f7f8f6;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.hl{background:#fff7e0}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.three{grid-template-columns:1fr}}
@media (max-width:860px){
  #app{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto}
  .brand{padding:10px 12px}.brand small{display:none}
  .nav{flex-direction:row;padding:6px}.nav button{padding:7px 9px;white-space:nowrap}
  .side .foot{display:none}
  .top{padding:10px 16px}.top .sub{display:none}
  #view{padding:14px 16px 60px}
  .split,.split.home,.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .list{max-height:none}
  .bar-r{grid-template-columns:100px minmax(0,1fr) 54px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand"><div class="logo">VT</div><div><b>VOLTALES</b><small>보조배터리 AS Desk</small></div></div>

    <div class="foot" id="foot"></div>
  </aside>
  <main>
    <header class="top">

      <div class="sp"></div>
      <label class="me">담당자 <input id="me" maxlength="12" placeholder="이름"></label>
      <button class="btn sm" data-act="reload" title="새로고침">↻ 새로고침</button>
    </header>
    <section id="view"><div class="loading"><span class="spin"></span> 불러오는 중…</div></section>
  </main>
</div>
<div id="layer"></div>
<div id="toast"></div>

  }).join('') + '</div>';
}

    var sns = selSns('ibSn');
    run('inboxDecide', { id: d.id, decision: 'confirm', sns: sns, qty: +$('#ibQty').value || sns.length || 1, reasonCode: $('#ibReason').value, note: $('#ibNote').value }, 'AS 건이 생성되었습니다.', b)
      .then(function (r) { if (r && r.inbox && r.inbox.caseId) openCase(r.inbox.caseId); });
  },
  ibDefend: function (d, b) { run('inboxDecide', { id: d.id, decision: 'defend', note: $('#ibDefReason').value + ($('#ibNote').value ? ' · ' + $('#ibNote').value : '') }, '방어 종결했습니다.', b); },
  ibHold: function (d, b) { run('inboxDecide', { id: d.id, decision: 'hold', note: $('#ibNote').value }, '보류로 옮겼습니다.', b); },
  ibDismiss: function (d, b) { run('inboxDecide', { id: d.id, decision: 'dismiss', note: $('#ibNote') ? $('#ibNote').value : '' }, '제외했습니다.', b); },
  ibReopen: function (d, b) { run('inboxDecide', { id: d.id, decision: 'reopen' }, '다시 열었습니다.', b); },
  manualInbox: function () {
    modal('Slack 접수 양식 수기 등록', '<div class="small muted" style="margin-bottom:8px">Slack 메시지나 카톡으로 받은 [볼타레스 A/S 접수양식] 전문을 그대로 붙여넣어 주세요.</div><textarea class="inp" id="mText" rows="14" placeholder="[볼타레스 A/S 접수양식]\n■ 문의사항 번호 : …\n■ 매장(지점명) : …\n■ S/N : …\n■ 증상 : …"></textarea>',
      '<button class="btn" data-act="closeModal">취소</button><button class="btn pri" data-act="manualInboxGo">등록</button>');
  },
  manualInboxGo: function (d, b) { run('inboxAddManual', { text: $('#mText').value }, '인입함에 등록했습니다.', b).then(function (r) { closeModal(); if (r && r.inbox) { S.view = 'inbox'; S.inboxFilter = '대기'; S.inboxSel = r.inbox.id; render(); } }); },
  syncSlack: function (d, b) { run('syncSlack', {}, function (r) { return r.skipped ? '다른 동기화가 진행 중입니다.' : 'Slack 동기화: 신규 ' + r.added + '건 · 자동 확정 ' + r.autoConfirmed + '건 · 방어 추정 ' + r.defendSuggested + '건' + (r.linked ? ' · 기존 이력 연결 ' + r.linked + '건' : ''); }, b); },
  syncCj: function (d, b) { run('syncCj', {}, function (r) { return 'CJ 조회 ' + r.checked + '건 · 반품 배송완료 ' + r.returnDelivered + '건' + (r.pending ? ' · 남은 ' + r.pending + '건은 다음 주기에' : ''); }, b); },
  // AS 건
  newCase: function () {
    modal('AS 직접 등록', '<div class="row"><label class="fld" style="flex:1"><span>매장명</span><input class="inp" id="nc_store"></label><label class="fld"><span>문의번호</span><input class="inp" id="nc_inq" style="width:120px"></label></div>' +
      '<div class="row" style="margin-top:8px"><label class="fld"><span>교체사유</span><select class="inp" id="nc_reason">' + L.REASONS.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('') + '</select></label>' +
      '<label class="fld"><span>수량</span><input class="inp" id="nc_qty" type="number" min="1" value="1" style="width:80px"></label></div>' +
      '<label class="fld" style="margin-top:8px"><span>접수 S/N (줄바꿈으로 여러 개)</span><textarea class="inp mono" id="nc_sns" rows="3"></textarea></label>' +
      '<label class="fld" style="margin-top:8px"><span>증상</span><textarea class="inp" id="nc_sym" rows="2"></textarea></label>',
      '<button class="btn" data-act="closeModal">취소</button><button class="btn pri" data-act="newCaseGo">등록</button>');
  },
  newCaseGo: function (d, b) {
    run('caseCreate', { store: $('#nc_store').value, inquiryNo: $('#nc_inq').value, reasonCode: $('#nc_reason').value, qty: +$('#nc_qty').value, sns: $('#nc_sns').value.split(/\n/), symptom: $('#nc_sym').value }, 'AS 건을 등록했습니다.', b)
      .then(function (r) { closeModal(); if (r && r.case) openCase(r.case.id); });
  },
  saveInfo: function (d, b) {
    var c = IDX.caseById[d.id];
    run('caseUpdate', { id: d.id, rev: c.rev || '0', fields: { inquiryNo: $('#cf_inquiryNo').value, store: $('#cf_store').value, reasonCode: $('#cf_reasonCode').value, model: $('#cf_model').value, symptom: $('#cf_symptom').value, note: $('#cf_note').value } }, '저장했습니다.', b);
  },
  shipOut: function (d, b) { run('shipOut', { caseId: d.id, outDate: $('#so_date').value, outTracking: $('#so_trk').value, outSns: $('#so_sns').value.split(/\n/) }, '출고 정보를 저장했습니다.', b); },
  setReturn: function (d, b) { var v = $('#sr_trk').value.trim(); if (!v) return toast('반품 송장번호를 입력해 주세요.', true); run('setReturn', { caseId: d.id, returnTracking: v }, '반품 송장을 등록했습니다.', b); },
  receive: function (d, b) {
    run('receive', { caseId: d.id, recvDate: $('#rc_date').value, recvSns: $('#rc_sns').value.split(/\n/), missingAs: $('#rc_missing').checked ? '미회수' : '' }, function (r) { return r.mismatch && r.mismatch.length ? '입고 처리 · S/N 상이 ' + r.mismatch.length + '건 확인 필요' : '입고 처리했습니다.'; }, b);
  },
  unitAll: function (d, el) { $$('.uSel').forEach(function (x) { x.checked = el.checked; }); },
  dispose: function (d, b) { var ids = selSns('uSel'); if (!ids.length) return toast('유닛을 선택해 주세요.', true); run('dispose', { unitIds: ids, disposition: $('#dispSel').value }, '처분을 기록했습니다.', b); },
  closeCase: function (d, b) { run('closeCase', { caseId: d.id, reason: $('#closeReason').value || '종결' }, '종결했습니다.', b); },
  reopenCase: function (d, b) { run('closeCase', { caseId: d.id, reopen: true }, '재개했습니다.', b); },
  inspectUnit: function (d) { S.inspSel = d.id; S.view = 'inspect'; closeDrawer(); render(); },
  trackOne: function (d, b) {
    b.disabled = true;
    call('trackOne', { no: d.no }).then(function (r) { toast(r.ok ? r.no + ' · ' + r.status + ' ' + String(r.at || '').slice(5, 16) + (r.ori ? ' · 원송장 ' + r.ori : '') : '조회 실패: ' + r.msg, !r.ok); }).catch(function (e) { toast(e.message, true); }).finally(function () { b.disabled = false; });
  },
  bulkReturn: function () {
    modal('반품 송장 일괄 등록', '<div class="small muted" style="margin-bottom:8px">CJ 반품 송장번호를 줄바꿈으로 붙여넣으면, CJ 조회 결과의 <b>원송장번호</b>로 해당 AS 건을 자동으로 찾아 연결합니다.</div><textarea class="inp mono" id="bulkTxt" rows="10" placeholder="844720086173\n844719509012"></textarea><div id="bulkOut" style="margin-top:10px"></div>',
      '<button class="btn" data-act="closeModal">닫기</button><button class="btn pri" data-act="bulkReturnGo">조회 후 연결</button>');
  },
  bulkReturnGo: function (d, b) {
    run('bulkReturns', { text: $('#bulkTxt').value }, function (r) { return '연결 ' + r.results.filter(function (x) { return x.ok; }).length + '/' + r.results.length + '건'; }, b).then(function (r) {
      if (!r) return;
      ACT.bulkReturn(); $('#bulkTxt').value = r.results.map(function (x) { return x.no; }).join('\n');
      $('#bulkOut').innerHTML = '<table class="t"><tbody>' + r.results.map(function (x) { return '<tr><td class="mono">' + esc(x.no) + '</td><td>' + (x.ok ? '<span class="pill p-green">연결</span> ' + esc(x.store || '') : '<span class="pill p-red">실패</span>') + '</td><td class="small muted">' + esc(x.msg) + '</td></tr>'; }).join('') + '</tbody></table>';
    });
  },
  // 검사
  inspSel: function (d) { S.inspSel = d.id; render(); },
  chip: function (d, el) {
    var box = el.parentNode, name = box.getAttribute('data-name');
    var was = el.classList.contains('on');
    $$('.chip', box).forEach(function (x) { x.classList.remove('on'); });
    if (!was) el.classList.add('on');
    if (name === 'verdict' && !was) {
      if (d.v === '정상') { if (!chipVal('cause')) setChip('cause', 'NTF(재현 안 됨)'); }
      if (!chipVal('disposition')) setChip('disposition', DEFAULT_DISP[d.v] || '');
    }
  },
  tpl: function (d) {
    var t = OPINION_TPL[+d.i];
    $('#in_op').value = t[0]; setChip('verdict', t[1]); if (t[2]) setChip('testSymptom', t[2]); setChip('cause', t[3]);
    if (!chipVal('disposition')) setChip('disposition', DEFAULT_DISP[t[1]]);
  },
  saveInspect: function (d, b) {
    var id = $('#inspCard').getAttribute('data-id');
    var cap = $('#in_cap').value;
    var verdict = chipVal('verdict'), cause = chipVal('cause');
    if (cap !== '' && +cap < 80 && !verdict) { verdict = '불량'; }
    if (cap !== '' && +cap < 80 && !cause) cause = '셀 용량 저하(80% 미만)';
    if (!verdict) return toast('판정을 선택해 주세요.', true);
    var next = inspectQueue().filter(function (u) { return u.id !== id; })[0];
    run('inspect', { unitId: id, verdict: verdict, testSymptom: chipVal('testSymptom'), cause: cause, opinion: $('#in_op').value, lot: $('#in_lot').value, capPct: cap, testDate: $('#in_date').value, disposition: chipVal('disposition') }, '검사 결과를 저장했습니다.', b)
      .then(function () { S.inspSel = next ? next.id : null; render(); var s = $('#scan'); if (s) s.focus(); });
  },
  // 설정
  resetConn: function () { ls('gasUrl', ''); ls('appKey', ''); location.reload(); },
  saveTok: function (d, b) { var v = $('#slackTok').value.trim(); if (!/^xox[pb]-/.test(v)) return toast('xoxp- 로 시작하는 토큰을 입력해 주세요.', true); run('saveSetting', { key: 'SLACK_TOKEN', value: v }, '토큰을 저장했습니다.', b); },
  trackTest: function (d, b) {
    var no = $('#trkTest').value; b.disabled = true;
    call('trackOne', { no: no }).then(function (r) { $('#trkOut').innerHTML = r.ok ? esc(r.no + ' · ' + r.status + ' · ' + r.at + ' · ' + (r.branch || '') + (r.ori ? ' · 원송장 ' + r.ori : '') + (r.delivered ? ' · 배송완료 ' + r.deliveredAt : '')) : '<span style="color:var(--red)">' + esc(r.msg) + '</span>'; })
      .catch(function (e) { $('#trkOut').textContent = e.message; }).finally(function () { b.disabled = false; });
  },
  importDry: function (d, b) { b.disabled = true; call('importTorder', { mode: 'dry' }).then(function (r) { S.preview = { type: 'import', data: r }; $('#syncOut').innerHTML = previewHtml(); }).catch(function (e) { toast(e.message, true); }).finally(function () { b.disabled = false; }); },
  importApply: function (d, b) { run('importTorder', { mode: 'apply' }, function (r) { return '가져오기 완료: 새 AS ' + r.casesNew + '건 · 유닛 ' + r.unitsNew + ' · 검사 매칭 ' + r.testsMatched + ' · 미매칭 ' + r.testsOrphan; }, b); },
  pushDry: function (d, b) { b.disabled = true; call('pushTorder', { mode: 'dry' }).then(function (r) { S.preview = { type: 'push', data: r }; render(); }).catch(function (e) { toast(e.message, true); }).finally(function () { b.disabled = false; }); },
  pushApply: function (d, b) { run('pushTorder', { mode: 'apply' }, function (r) { return '티오더 시트 반영: ' + r.applied + '셀 · 새 행 ' + r.newRows + ' · 테스트 결과 ' + r.newTests; }, b).then(function () { S.preview = null; render(); }); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var f = ACT[el.getAttribute('data-act')]; if (!f) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  f(el.dataset, el);
});
var qTimer;
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { clearTimeout(qTimer); var v = e.target.value; qTimer = setTimeout(function () { S.q = v; render(); var q = $('#q'); if (q) { q.focus(); q.setSelectionRange(v.length, v.length); } }, 250); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'modelF') { S.model = e.target.value; render(); }
  if (e.target.id === 'anMonths') { S.an.months = +e.target.value; render(); }
  if (e.target.id === 'me') ls('me', e.target.value.trim());
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if ($('#mbg')) closeModal(); else if (S.caseSel) closeDrawer(); }
  if (e.target.id === 'scan' && e.key === 'Enter') {
    var v = e.target.value.toUpperCase().replace(/\s/g, '').replace(/^P20BPTA/, 'P20BOTA');
    if (!v) return;
    var hit = S.data.units.filter(function (u) { return u.recvSn === v || u.origSn === v; });
    var pend = hit.filter(function (u) { return !u.verdict; })[0] || hit[0];
    if (pend) { S.inspSel = pend.id; render(); toast(v + ' 선택'); }
    else toast(v + ' — 해당 S/N의 AS 건이 없습니다. 출고·회수에서 입고 처리를 먼저 해 주세요.', true);
  }
});
$('#me').value = ls('me') || '';
load();
</script>
</body>
</html>
